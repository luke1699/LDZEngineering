<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }} · {{ site.Params.role }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta name="author" content="{{ site.Params.firstName }} {{ site.Params.lastName }}">
<meta name="theme-color" content="#34759C">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.Title }} · {{ site.Params.role }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ with site.Params.og_image }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
<meta property="og:locale" content="it_IT">

<!-- Favicon dal logo LDZ -->
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">

<!-- Font e icone ospitati localmente (nessuna richiesta a Google Fonts o CDN) -->
<link rel="preload" href="{{ "vendor/fonts/ibm-plex-sans-latin-400-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "vendor/fonts/fonts.css" | relURL }}">
<link rel="stylesheet" href="{{ "vendor/fontawesome/css/all.min.css" | relURL }}">

{{ $css := resources.Get "css/main.css" }}
{{ if hugo.IsProduction }}{{ $css = $css | minify | fingerprint }}{{ end }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}"{{ if hugo.IsProduction }} integrity="{{ $css.Data.Integrity }}"{{ end }}>
