title: "Chi sono"
intro: >-
  Sono un ingegnere edile abilitato, specializzato in **Building Automation Control System**
  e nella **gestione integrata degli impianti** all'interno degli edifici.
body:
  - >-
    Il mio lavoro parte da una convinzione semplice: un edificio efficiente non è solo ben isolato,
    è un sistema in cui involucro, impianti e controllo lavorano insieme. Per questo unisco
    la progettazione edile e BIM a sensori, reti e logiche di regolazione.
  - >-
    Nella tesi magistrale ho sviluppato una soluzione di building management per il risparmio energetico
    e l'ottimizzazione di impianti di VMC esistenti; oggi porto avanti un sistema di supervisione
    pensato per migliorare comfort, sicurezza e consumi, gestibile anche da remoto.
  - >-
    Mi interessa capire il linguaggio di ogni figura del cantiere – idraulico, elettricista, progettista –
    perché parlare la stessa lingua riduce gli errori e rende i progetti più solidi.
