title: "Chi sono"
intro: >-
  Sono un Ingegnere Edile abilitato, specializzato in **Building Automation and Control Systems** (BACS), 
  progettazione impiantistica e **gestione integrata dei sistemi tecnologici** degli edifici.

body:
  - >-
    La mia attività si fonda su una convinzione: un edificio efficiente non è semplicemente un edificio ben isolato, 
    ma un sistema integrato in cui involucro, impianti e sistemi di controllo dialogano e lavorano in sinergia.
    Per questo integro le competenze della progettazione edile e della metodologia BIM con quelle dell'automazione, 
    sviluppando soluzioni che combinano sensori, reti di comunicazione, sistemi di supervisione e logiche di regolazione 
    per ottimizzare il funzionamento degli edifici.
  - >-
    Durante la mia tesi magistrale ho sviluppato una soluzione di Building Management orientata al risparmio energetico e 
    all'ottimizzazione delle prestazioni di impianti di ventilazione meccanica controllata (VMC) esistenti. 
    Un percorso di ricerca e sviluppo che continua oggi attraverso la realizzazione di un sistema di supervisione e 
    gestione intelligente degli impianti, progettato per migliorare il comfort ambientale, la sicurezza e l'efficienza energetica, 
    anche attraverso il controllo e il monitoraggio da remoto.
  - >-
    Credo inoltre che la qualità di un progetto dipenda dalla capacità di integrare competenze e professionalità differenti. 
  Comprendere il linguaggio di ogni figura coinvolta – dall'idraulico all'elettricista, dal progettista all'installatore – significa 
  favorire il dialogo, prevenire interferenze e criticità e trasformare le idee progettuali in soluzioni concrete, funzionali e affidabili.
  
